<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KICK · BRIDGED-T</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background-color: #0d0e11;
    color: #e8e6e1;
    font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;
    font-weight: 400;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  /* ---- start overlay (iOS audio unlock) ---- */
  #overlay {
    position: fixed; inset: 0; z-index: 50;
    background-color: #0d0e11;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
  }
  #overlay .ttl { font-size: 13px; letter-spacing: 4px; color: #6b6f76; }
  #overlay .big { font-size: 22px; letter-spacing: 2px; font-weight: 600; }
  #overlay .sub { font-size: 11px; letter-spacing: 1px; color: #6b6f76; max-width: 320px; line-height: 1.6; }
  #startBtn {
    -webkit-appearance: none !important; appearance: none !important;
    background-color: #ff8c3a; color: #0d0e11;
    border: none; border-radius: 4px;
    font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 3px;
    padding: 14px 40px; margin-top: 6px; cursor: pointer;
    touch-action: manipulation;
  }
  #startBtn:active { background-color: #ffa75e; }

  /* ---- panel ---- */
  .panel {
    width: 100%; max-width: 440px;
    background-color: #16181d;
    border: 1px solid #24272e;
    border-radius: 8px;
    padding: 18px 18px 20px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .head .name { font-size: 15px; font-weight: 600; letter-spacing: 3px; }
  .head .idx { font-size: 11px; color: #ff8c3a; letter-spacing: 2px; }
  .sub-circuit { font-size: 9.5px; color: #565a61; letter-spacing: 1.5px; margin-bottom: 16px; }

  .knobs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px 6px;
    margin-bottom: 16px;
  }
  .knob-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .knob {
    width: 100%; max-width: 76px; aspect-ratio: 1 / 1;
    touch-action: none; cursor: ns-resize;
  }
  .knob svg { width: 100%; height: 100%; display: block; }
  .knob .track { fill: none; stroke: #24272e; stroke-width: 6; stroke-linecap: round; }
  .knob .val   { fill: none; stroke: #ff8c3a; stroke-width: 6; stroke-linecap: round; }
  .knob .ptr   { stroke: #e8e6e1; stroke-width: 3; stroke-linecap: round; }
  .knob .hub   { fill: #1c1f25; stroke: #2c2f37; stroke-width: 1; }
  .klabel { font-size: 9.5px; letter-spacing: 1.5px; color: #9aa0a8; }
  .kval   { font-size: 10px; letter-spacing: 0.5px; color: #e8e6e1; }
  .kval .u { color: #565a61; }

  .transport {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 10px;
    align-items: stretch;
  }
  .pad {
    -webkit-appearance: none !important; appearance: none !important;
    background-color: #1c1f25; color: #e8e6e1;
    border: 1px solid #2c2f37; border-radius: 6px;
    font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 3px;
    padding: 18px 0; cursor: pointer; touch-action: none;
    transition: background-color 0.06s linear, border-color 0.06s linear;
  }
  .pad.hit { background-color: #ff8c3a; color: #0d0e11; border-color: #ff8c3a; }
  .run {
    -webkit-appearance: none !important; appearance: none !important;
    background-color: #1c1f25; color: #9aa0a8;
    border: 1px solid #2c2f37; border-radius: 6px;
    font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 2px;
    cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  .run.on { background-color: #243018; color: #b6e26a; border-color: #3c5224; }
  .mini { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
          background-color: #1c1f25; border: 1px solid #2c2f37; border-radius: 6px; padding: 6px; }
  .mini .knob { max-width: 46px; }
  .mini .klabel { font-size: 8.5px; }
</style>
</head>
<body>

  <div id="overlay">
    <div class="ttl">ERICA-INSPIRED · ANALOG MODEL</div>
    <div class="big">KICK · BRIDGED-T</div>
    <div class="sub">Résonateur pingé non-linéaire (SVF auto-limité). Touche pour démarrer l'audio.</div>
    <button id="startBtn">START</button>
    <div class="sub" id="errLine" style="color:#ff6b6b; display:none; white-space:pre-wrap;"></div>
  </div>

  <div class="panel" id="panel" style="visibility:hidden">
    <div class="head">
      <div class="name">KICK</div>
      <div class="idx">VOICE 01</div>
    </div>
    <div class="sub-circuit">BRIDGED-T RESONANT NETWORK · NONLINEAR ZDF-SVF</div>

    <div class="knobs" id="knobs"></div>

    <div class="transport">
      <button class="pad" id="pad">TRIG</button>
      <button class="run" id="run">RUN</button>
      <div class="mini">
        <div class="knob" id="bpmKnob"></div>
        <div class="klabel">BPM <span id="bpmVal">120</span></div>
      </div>
    </div>
  </div>

  <!-- ============ AUDIOWORKLET (loaded via Blob, keeps single-file) ============ -->
  <script id="kick-worklet" type="text/worklet">
    // Pinged bridged-T resonator modelled as a TPT / zero-delay-feedback
    // state-variable filter. The op-amp/transistor limiting of the real
    // bridged-T oscillator is modelled by soft-saturating the band-integrator
    // state in the loop -> the resonance self-limits and grows harmonics on
    // harder hits, instead of ringing as a pure linear sine.
    class KickProcessor extends AudioWorkletProcessor {
      static get parameterDescriptors() {
        return [
          { name: 'tune',      defaultValue: 52,    minValue: 24,    maxValue: 160,  automationRate: 'k-rate' },
          { name: 'decay',     defaultValue: 0.50,  minValue: 0.05,  maxValue: 2.0,  automationRate: 'k-rate' },
          { name: 'pitchAmt',  defaultValue: 220,   minValue: 0,     maxValue: 700,  automationRate: 'k-rate' },
          { name: 'pitchTime', defaultValue: 0.05,  minValue: 0.005, maxValue: 0.25, automationRate: 'k-rate' },
          { name: 'drive',     defaultValue: 2.2,   minValue: 1.0,   maxValue: 14.0, automationRate: 'k-rate' },
          { name: 'click',     defaultValue: 0.35,  minValue: 0,     maxValue: 1.0,  automationRate: 'k-rate' },
          { name: 'level',     defaultValue: 0.85,  minValue: 0,     maxValue: 1.0,  automationRate: 'k-rate' }
        ];
      }
      constructor() {
        super();
        this.sr = sampleRate;
        this.frame = 0;
        this.queue = [];          // sample-accurate scheduled triggers
        this.active = false;
        this.t = 0;               // samples since last fire
        this.vel = 1;
        this.ic1 = 0; this.ic2 = 0;   // SVF integrator states
        this.hpIn = 0; this.hpOut = 0; // 1-pole HPF for the attack click
        this.port.onmessage = (e) => {
          var d = e.data;
          if (d.type === 'trig') {
            this.queue.push({ frame: Math.round(d.time * this.sr), vel: (d.vel == null ? 1 : d.vel) });
            this.queue.sort(function (a, b) { return a.frame - b.frame; });
          }
        };
      }
      fire(vel) {
        this.active = true; this.t = 0; this.vel = vel;
        this.hpIn = 0; this.hpOut = 0;
        // states are NOT hard-reset: a re-kick of a still-ringing circuit
        // interacts with residual energy, like the real thing.
      }
      process(inputs, outputs, p) {
        var out = outputs[0][0];
        if (!out) return true;
        var N = out.length, sr = this.sr;
        var tune = p.tune[0], decay = p.decay[0], pAmt = p.pitchAmt[0];
        var pTime = p.pitchTime[0], drive = p.drive[0], click = p.click[0], level = p.level[0];
        var piSr = Math.PI / sr;
        var tauTrig = 0.0016;                          // ~1.6 ms excitation pulse
        var Q = Math.max(0.5, Math.PI * tune * decay); // decay ~ e-fold ring time (s)
        var k = 1 / Q;
        var makeup = drive * 1.1;                      // compensate the in-loop limiter
        var fMax = sr * 0.45;

        for (var i = 0; i < N; i++) {
          while (this.queue.length && this.queue[0].frame <= this.frame) {
            this.fire(this.queue.shift().vel);
          }
          var y = 0;
          if (this.active) {
            var ts = this.t / sr;
            var f = tune + pAmt * Math.exp(-ts / pTime);   // downward pitch sweep
            if (f > fMax) f = fMax;
            var exc = this.vel * Math.exp(-ts / tauTrig);  // trigger conditioning pulse

            var g = Math.tan(piSr * f);
            var a1 = 1 / (1 + g * (g + k));
            var a2 = g * a1;
            var a3 = g * a2;

            var v3 = exc - this.ic2;
            var v1 = a1 * this.ic1 + a2 * v3;              // band-pass output
            var v2 = this.ic2 + a2 * this.ic1 + a3 * v3;
            this.ic1 = 2 * v1 - this.ic1;
            this.ic2 = 2 * v2 - this.ic2;

            // --- nonlinear self-limiting (the heart of the analog character) ---
            this.ic1 = Math.tanh(drive * this.ic1) / drive;

            var band = v1 * makeup;

            // attack click: 1-pole high-pass of the trigger transient
            this.hpOut = 0.90 * (this.hpOut + exc - this.hpIn);
            this.hpIn = exc;

            y = Math.tanh(band + click * this.hpOut);

            this.t++;
            if (ts > 0.03 && Math.abs(this.ic1) < 1e-6 && Math.abs(this.ic2) < 1e-6) this.active = false;
            if (ts > 4.0) this.active = false;
          }
          out[i] = y * level;
          this.frame++;
        }
        return true;
      }
    }
    registerProcessor('kick-processor', KickProcessor);
  </script>

  <!-- ============ MAIN ============ -->
  <script>
  (function () {
    var ctx = null, node = null, started = false;
    var velocity = 0.9, bpm = 120;

    var KNOBS = [
      { p:'tune',      label:'TUNE',   min:24,    max:160,  def:52,   unit:'Hz', fmt:function(v){return v.toFixed(0);} },
      { p:'decay',     label:'DECAY',  min:0.05,  max:2.0,  def:0.50, unit:'s',  fmt:function(v){return v.toFixed(2);} },
      { p:'pitchAmt',  label:'PITCH',  min:0,     max:700,  def:220,  unit:'Hz', fmt:function(v){return v.toFixed(0);} },
      { p:'pitchTime', label:'P.TIME', min:0.005, max:0.25, def:0.05, unit:'ms', fmt:function(v){return (v*1000).toFixed(0);} },
      { p:'drive',     label:'DRIVE',  min:1.0,   max:14.0, def:2.2,  unit:'',   fmt:function(v){return v.toFixed(1);} },
      { p:'click',     label:'CLICK',  min:0,     max:1,    def:0.35, unit:'',   fmt:function(v){return v.toFixed(2);} },
      { p:'level',     label:'LEVEL',  min:0,     max:1,    def:0.85, unit:'',   fmt:function(v){return v.toFixed(2);} },
      { p:'vel',       label:'VEL',    min:0.1,   max:1.0,  def:0.9,  unit:'',   fmt:function(v){return v.toFixed(2);} }
    ];

    var state = {};
    KNOBS.forEach(function (k) { state[k.p] = k.def; });

    // ---------- knob rendering ----------
    function pt(deg, r) { var a = (deg - 90) * Math.PI / 180; return [50 + r * Math.cos(a), 50 + r * Math.sin(a)]; }
    function arcPath(r, a0, a1) {
      var s = pt(a0, r), e = pt(a1, r);
      var large = (a1 - a0) > 180 ? 1 : 0;
      return 'M ' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) +
             ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2);
    }
    var A0 = -135, SWEEP = 270, R = 38;

    function buildKnob(host, cfg, onChange) {
      host.innerHTML =
        '<svg viewBox="0 0 100 100">' +
        '<path class="track" d="' + arcPath(R, A0, A0 + SWEEP) + '"></path>' +
        '<path class="val"></path>' +
        '<line class="ptr"></line>' +
        '<circle class="hub" cx="50" cy="50" r="13"></circle>' +
        '</svg>';
      var valEl = host.querySelector('.val');
      var ptrEl = host.querySelector('.ptr');
      var norm = (cfg.def - cfg.min) / (cfg.max - cfg.min);

      function render() {
        var deg = A0 + norm * SWEEP;
        valEl.setAttribute('d', arcPath(R, A0, deg));
        var inner = pt(deg, 16), outer = pt(deg, 33);
        ptrEl.setAttribute('x1', inner[0].toFixed(2)); ptrEl.setAttribute('y1', inner[1].toFixed(2));
        ptrEl.setAttribute('x2', outer[0].toFixed(2)); ptrEl.setAttribute('y2', outer[1].toFixed(2));
        onChange(cfg.min + norm * (cfg.max - cfg.min));
      }

      var dragging = false, lastY = 0;
      host.addEventListener('pointerdown', function (ev) {
        dragging = true; lastY = ev.clientY;
        host.setPointerCapture(ev.pointerId); ev.preventDefault();
      });
      host.addEventListener('pointermove', function (ev) {
        if (!dragging) return;
        var dy = lastY - ev.clientY; lastY = ev.clientY;
        var sens = ev.shiftKey ? 0.0008 : 0.005;
        norm = Math.max(0, Math.min(1, norm + dy * sens));
        render(); ev.preventDefault();
      });
      function up(ev) { dragging = false; }
      host.addEventListener('pointerup', up);
      host.addEventListener('pointercancel', up);
      host.addEventListener('dblclick', function () {
        norm = (cfg.def - cfg.min) / (cfg.max - cfg.min); render();
      });

      render();
    }

    // build voice knobs (first 7) + VEL
    var grid = document.getElementById('knobs');
    KNOBS.slice(0, 8).forEach(function (cfg) {
      var wrap = document.createElement('div');
      wrap.className = 'knob-wrap';
      var kn = document.createElement('div'); kn.className = 'knob';
      var lab = document.createElement('div'); lab.className = 'klabel'; lab.textContent = cfg.label;
      var val = document.createElement('div'); val.className = 'kval';
      wrap.appendChild(kn); wrap.appendChild(lab); wrap.appendChild(val);
      grid.appendChild(wrap);
      buildKnob(kn, cfg, function (v) {
        state[cfg.p] = v;
        val.innerHTML = cfg.fmt(v) + (cfg.unit ? ' <span class="u">' + cfg.unit + '</span>' : '');
        if (cfg.p === 'vel') { velocity = v; return; }
        if (node) node.parameters.get(cfg.p).setTargetAtTime(v, ctx.currentTime, 0.008);
      });
    });

    // BPM knob (mini)
    buildKnob(document.getElementById('bpmKnob'),
      { min: 50, max: 200, def: 120 },
      function (v) { bpm = Math.round(v); document.getElementById('bpmVal').textContent = bpm; });

    // ---------- transport ----------
    var pad = document.getElementById('pad');
    var runBtn = document.getElementById('run');

    function trig(vel, when) {
      if (!node) return;
      var t = (when == null) ? (ctx.currentTime + 0.005) : when;
      node.port.postMessage({ type: 'trig', time: t, vel: vel });
      flashPad(t);
    }
    function flashPad(at) {
      var ms = node ? Math.max(0, (at - ctx.currentTime) * 1000) : 0;
      setTimeout(function () {
        pad.classList.add('hit');
        setTimeout(function () { pad.classList.remove('hit'); }, 70);
      }, ms);
    }

    pad.addEventListener('pointerdown', function (e) { e.preventDefault(); trig(velocity); });

    // lookahead scheduler ("two clocks": setTimeout drives scheduling,
    // but trigger times are AudioContext-scheduled => sample-accurate)
    var running = false, nextTime = 0, beat = 0, schedTimer = null;
    var LOOKAHEAD = 0.025, AHEAD = 0.12;
    function scheduler() {
      while (nextTime < ctx.currentTime + AHEAD) {
        var v = (beat % 4 === 0) ? Math.min(1, velocity * 1.15) : velocity; // downbeat accent
        trig(v, nextTime);
        nextTime += 60 / bpm;
        beat++;
      }
      schedTimer = setTimeout(scheduler, LOOKAHEAD * 1000);
    }
    runBtn.addEventListener('click', function () {
      if (!node) return;
      running = !running;
      runBtn.classList.toggle('on', running);
      if (running) { nextTime = ctx.currentTime + 0.1; beat = 0; scheduler(); }
      else { clearTimeout(schedTimer); }
    });

    // ---------- audio start (iOS unlock) ----------
    function showErr(msg) {
      var e = document.getElementById('errLine');
      e.style.display = 'block';
      e.textContent = msg;
    }
    async function loadModule(src) {
      // Safari iOS: try Blob URL, fall back to data: URL (often succeeds where Blob fails)
      var firstErr = null;
      try {
        var burl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        await ctx.audioWorklet.addModule(burl);
        return 'blob';
      } catch (e1) {
        firstErr = e1;
      }
      await ctx.audioWorklet.addModule('data:text/javascript;charset=utf-8,' + encodeURIComponent(src));
      return 'data (blob a échoué: ' + (firstErr && firstErr.message ? firstErr.message : firstErr) + ')';
    }
    var starting = false;
    async function start() {
      if (started || starting) return;
      starting = true;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) throw new Error('AudioContext indisponible sur ce navigateur');
        ctx = new AC();
        if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
        if (!ctx.audioWorklet) throw new Error('AudioWorklet absent (contexte non sécurisé ? ouvre via http/https, pas file://)');
        var src = document.getElementById('kick-worklet').textContent;
        if (!src || !src.trim()) throw new Error('source du worklet vide');
        await loadModule(src);
        node = new AudioWorkletNode(ctx, 'kick-processor', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
        KNOBS.slice(0, 7).forEach(function (k) { node.parameters.get(k.p).value = state[k.p]; });
        node.connect(ctx.destination);
        if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) {} }
        started = true;
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('panel').style.visibility = 'visible';
      } catch (err) {
        starting = false;
        showErr('ÉCHEC DÉMARRAGE\n' + (err && err.message ? err.message : String(err)) + '\n(retape START pour réessayer)');
        if (window.console) console.error(err);
      }
    }
    document.getElementById('startBtn').addEventListener('click', start);
  })();
  </script>
</body>
</html>

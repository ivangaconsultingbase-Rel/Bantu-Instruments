const cellRefs={kick:[],snare:[],hatC:[],hatO:[]};function buildSeq(){let seq=document.getElementById('seq');[['kick','KICK','kk'],['snare','SNR','sn'],['hatC','HC','hc'],['hatO','HO','ho']].forEach(r=>{let row=document.createElement('div'),lab=document.createElement('div'),cells=document.createElement('div');row.className='seqrow';lab.className='seqlabel';lab.textContent=r[1];cells.className='cells';for(let s=0;s<16;s++){let c=document.createElement('button'),st=pattern[r[0]][s];c.className='cell '+r[2]+((s%4===3&&s<15)?' g4':'')+(st?' on':'')+(st===2?' acc':'');c.onclick=()=>{let v=(pattern[r[0]][s]+1)%3;pattern[r[0]][s]=v;c.classList.toggle('on',v>=1);c.classList.toggle('acc',v===2)};cells.appendChild(c);cellRefs[r[0]].push(c)}row.append(lab,cells);seq.appendChild(row)})}

function applyPreset(pr){Object.assign(P.kick,clone(DEFAULTS.kick));Object.assign(P.snare,clone(DEFAULTS.snare));Object.assign(P.hat,clone(DEFAULTS.hat));Object.assign(P.fx,clone(DEFAULTS.fx));if(pr.ov)Object.keys(pr.ov).forEach(v=>Object.assign(P[v],pr.ov[v]));Object.keys(pattern).forEach(v=>pattern[v]=clone(pr.pat[v]));bpmSet(pr.bpm);swingSet(pr.swing);accSet(pr.accent);buildPanel(activeTab);refreshSeq();bankStatus(pr.name)}
function snapshot(){return{bpm,swing,accent,P:clone(P),pattern:clone(pattern)}}function applySnapshot(s){if(!s)return;Object.keys(P).forEach(v=>Object.assign(P[v],s.P&&s.P[v]||{}));Object.keys(pattern).forEach(v=>{if(s.pattern&&s.pattern[v])pattern[v]=clone(s.pattern[v])});bpmSet(s.bpm||bpm);swingSet(s.swing||swing);accSet(s.accent||accent);buildPanel(activeTab);refreshSeq()}function bankStatus(t){document.getElementById('bankStatus').textContent=t?'  '+t:''}
